name: Windows portable build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build static portable EXE
        shell: pwsh
        run: ./build.ps1 -VcpkgRoot "$env:GITHUB_WORKSPACE\.deps\vcpkg"

      - uses: actions/upload-artifact@v4
        with:
          name: FrameCap-Windows-x64
          path: dist/*

      - name: Package zip
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath FrameCap-Windows-x64.zip -Force

      - name: Generate release notes (commit list)
        id: notes
        shell: pwsh
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          "tag=$tag" >> $env:GITHUB_OUTPUT

          git fetch --tags --force
          $prevTag = git tag --sort=-creatordate | Select-Object -First 1

          $notesFile = "release-notes.md"
          @(
            "## Changes",
            ""
          ) | Set-Content $notesFile

          if ($prevTag) {
            Add-Content $notesFile "_Since $prevTag_"
            Add-Content $notesFile ""
            git log "$prevTag..HEAD" --pretty=format:"- %s (%h)"
          } else {
            Add-Content $notesFile "_Initial build_"
            Add-Content $notesFile ""
            git log --pretty=format:"- %s (%h)"
          } | Add-Content $notesFile

          "notes_file=$notesFile" >> $env:GITHUB_OUTPUT

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.notes.outputs.tag }}"
          $notesFile = "${{ steps.notes.outputs.notes_file }}"

          gh release create $tag FrameCap-Windows-x64.zip `
            --target $env:GITHUB_SHA `
            --title "FrameCap $tag" `
            --notes-file $notesFile
